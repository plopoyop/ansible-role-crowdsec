---
# Allowlists (CrowdSec >= 1.6.8) are applied by the local API to every
# decision source (community/console blocklists, cscli decisions), unlike the
# whitelist parser which only filters alerts built from logs.
# A reload (SIGHUP) restarts the local API asynchronously.
- name: "Wait for the local API"
  ansible.builtin.command:
    cmd: "cscli lapi status"
  register: crowdsec_lapi_status
  until: crowdsec_lapi_status.rc == 0
  retries: 20
  delay: 3
  changed_when: false
  check_mode: false

- name: "List allowlists"
  ansible.builtin.command:
    cmd: "cscli allowlists list -o json"
  register: crowdsec_allowlists
  changed_when: false
  check_mode: false

- name: "Compute allowlist changes"
  ansible.builtin.set_fact:
    crowdsec_allowlist_current: "{{ crowdsec_allowlist_found[0] | default({}) }}"
    crowdsec_allowlist_current_values: "{{ (crowdsec_allowlist_found[0]['items'] | default([], true)) | map(attribute='value') | list }}"
  vars:
    crowdsec_allowlist_found: >-
      {{ (crowdsec_allowlists.stdout | from_json | default([], true))
      | selectattr('name', 'equalto', crowdsec_allowlist_name) | list }}

- name: "Create the allowlist"
  ansible.builtin.command:
    cmd: "cscli allowlists create {{ crowdsec_allowlist_name }} --description 'Managed by Ansible (crowdsec_whitelist_ips/cidrs)'"
  when:
    - crowdsec_allowlist_values | length > 0
    - crowdsec_allowlist_current | length == 0
  changed_when: true

- name: "Add missing allowlist values"
  ansible.builtin.command:
    argv: "{{ ['cscli', 'allowlists', 'add', crowdsec_allowlist_name] + crowdsec_allowlist_missing }}"
  vars:
    crowdsec_allowlist_missing: "{{ crowdsec_allowlist_values | difference(crowdsec_allowlist_current_values) }}"
  when: crowdsec_allowlist_missing | length > 0
  changed_when: true

- name: "Remove extra allowlist values"
  ansible.builtin.command:
    argv: "{{ ['cscli', 'allowlists', 'remove', crowdsec_allowlist_name] + crowdsec_allowlist_extra }}"
  vars:
    crowdsec_allowlist_extra: "{{ crowdsec_allowlist_current_values | difference(crowdsec_allowlist_values) }}"
  when:
    - crowdsec_allowlist_values | length > 0
    - crowdsec_allowlist_extra | length > 0
  changed_when: true

- name: "Delete the allowlist"
  ansible.builtin.command:
    cmd: "cscli allowlists delete {{ crowdsec_allowlist_name }}"
  when:
    - crowdsec_allowlist_values | length == 0
    - crowdsec_allowlist_current | length > 0
  changed_when: true
