---
- name: Prepare
  hosts: all
  tasks:
    - name: "Install nft, used by verify"
      ansible.builtin.apt:
        name: "nftables"
        state: "present"
        update_cache: true

    - name: "Start nftables (its ruleset flushes everything on reload)"
      ansible.builtin.systemd_service:
        name: "nftables"
        state: "started"

    - name: "Create the log file read by the test acquisition"
      ansible.builtin.file:
        path: "/var/log/caddy"
        state: "directory"
        mode: "0755"
